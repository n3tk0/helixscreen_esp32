;
; PlatformIO project for the HelixScreen ESP32-S3 firmware.
; Mirrors the ESP32_Logger setup: espressif32 platform + ESP-IDF framework.
;
;   pio run                  # build
;   pio run -t upload        # flash
;   pio device monitor       # serial monitor
;   pio run -t menuconfig     # ESP-IDF menuconfig (WiFi/Moonraker)
;
; Sources live in src/ (PlatformIO ESP-IDF convention); ESP-IDF reads
; sdkconfig.defaults + src/Kconfig.projbuild + src/idf_component.yml itself.

[platformio]
default_envs = waveshare_s3_touch_28

[env:waveshare_s3_touch_28]
; Pin the platform to match ESP32_Logger so both projects build against the
; same ESP-IDF. Bump in lockstep with the logger project.
platform = espressif32@^6.8.1
framework = espidf
board = esp32-s3-devkitc-1

; Waveshare ESP32-S3-Touch-LCD-2.8 ships 16MB flash + 8MB PSRAM. PSRAM, target,
; and partition validation are configured in sdkconfig.defaults; tell the
; uploader/partition tool about the flash size + custom table here.
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
