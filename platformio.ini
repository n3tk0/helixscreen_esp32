;
; PlatformIO project for the HelixScreen ESP32-S3 firmware.
; espressif32 platform + ESP-IDF framework.
;
;   pio run                  # build
;   pio run -t upload        # flash
;   pio device monitor       # serial monitor
;   pio run -t menuconfig     # ESP-IDF menuconfig (WiFi/Moonraker)
;
; Sources live in src/ (PlatformIO ESP-IDF convention); ESP-IDF reads
; sdkconfig.defaults + src/Kconfig.projbuild + src/idf_component.yml itself.

[platformio]
default_envs = waveshare_s3_touch_28

[env:waveshare_s3_touch_28]
; Pin the platform so builds are reproducible; espressif32 6.8.x provides
; ESP-IDF 5.x. Bump deliberately.
platform = espressif32@^6.8.1
framework = espidf
board = esp32-s3-devkitc-1

; Waveshare ESP32-S3-Touch-LCD-2.8 ships 16MB flash + 8MB PSRAM. PSRAM, target,
; and partition validation are configured in sdkconfig.defaults; tell the
; uploader/partition tool about the flash size + custom table here.
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; LVGL font/asset .c files (src/fonts/) use the #ifdef LV_LVGL_H_INCLUDE_SIMPLE
    ; guard to pick `#include "lvgl.h"` over `#include "lvgl/lvgl.h"`. The managed
    ; lvgl component exposes the header as <lvgl.h>, so force the simple form.
    -DLV_LVGL_H_INCLUDE_SIMPLE
